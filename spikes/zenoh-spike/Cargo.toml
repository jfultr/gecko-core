[package]
name = "zspike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
zenoh = { version = "=1.10.2" }
zenoh-ext = { version = "=1.10.2", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace]
