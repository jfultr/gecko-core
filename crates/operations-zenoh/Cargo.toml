[package]
name = "operations-zenoh"
version = "0.1.0-dev"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Gecko Operation module: minimal Zenoh adapter, client and demo (0.1.0-dev)"

[features]
# Link-cut proxy and the scripted demo scenario. Not for production use.
test-support = ["operations/test-support"]

[dependencies]
operations = { path = "../operations" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zenoh = { version = "=1.10.2" }

[lints]
workspace = true

[[example]]
name = "demo"
required-features = ["test-support"]

[[test]]
name = "scenario"
required-features = ["test-support"]

[[test]]
name = "follow"
required-features = ["test-support"]

[[test]]
name = "matrix"
required-features = ["test-support"]
