[package]
name = "operations"
version = "0.1.0-dev"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Gecko Operation module: transport-neutral core (0.1.0-dev harness skeleton)"

[features]
# Controllable test executor and fixtures. Not for production use.
test-support = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[lints]
workspace = true

[[test]]
name = "harness"
required-features = ["test-support"]

[[test]]
name = "contracts"
required-features = ["test-support"]

[[test]]
name = "acceptance"
required-features = ["test-support"]

[[example]]
name = "smoke"
required-features = ["test-support"]

[dev-dependencies]
serde_json = "1.0.154"
